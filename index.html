<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>키워드분석기</title><style>*{box-sizing:border-box;margin:0;padding:0}:root{--bg:#060810;--card:#111827;--card2:#161f2e;--accent:#00d4ff;--accent2:#6366f1;--green:#00c896;--yellow:#fbbf24;--red:#f87171;--orange:#fb923c;--text:#f0f6ff;--muted:#4b5a6e;--border:#1c2a3a}body{font-family:sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}header{background:rgba(6,8,16,.97);border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}.logo{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}.htitle{font-size:15px;font-weight:900}.hsub{font-size:10px;color:var(--muted)}.live{margin-left:auto;background:rgba(0,200,150,.15);border:1px solid rgba(0,200,150,.3);border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;color:var(--green)}main{padding:14px;max-width:480px;margin:0 auto}.sbox{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px}.slabel{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.srow{display:flex;gap:8px}input{flex:1;background:transparent;border:none;outline:none;font-size:16px;font-weight:700;color:var(--text);font-family:inherit}input::placeholder{color:var(--muted)}.btn{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:12px;padding:10px 20px;color:#fff;font-size:13px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.4}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}.chip{background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;color:#7a8fa6;cursor:pointer}.loading{display:none;text-align:center;padding:48px 0}.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-right-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}@keyframes spin{to{transform:rotate(360deg)}}.err{display:none;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.25);border-radius:14px;padding:16px;text-align:center;margin-bottom:10px;color:var(--red);font-size:13px;font-weight:700}.res{display:none}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.sc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;position:relative;overflow:hidden}.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}.sc.c1::before{background:linear-gradient(90deg,var(--accent),#0ea5e9)}.sc.c2::before{background:linear-gradient(90deg,var(--accent2),#a855f7)}.sc.c3::before{background:linear-gradient(90deg,var(--orange),#fb923c)}.sc.c4::before{background:linear-gradient(90deg,var(--yellow),#f59e0b)}.slb{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.sv{font-size:22px;font-weight:900;line-height:1;margin-bottom:2px}.ssb{font-size:10px;color:var(--muted)}.c1 .sv{color:var(--accent)}.c2 .sv{color:#a78bfa}.c3 .sv{color:var(--orange)}.c4 .sv{color:var(--yellow)}.sec{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px}.st{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}.krow{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}.krow:last-child{border-bottom:none}.knum{width:20px;font-size:10px;color:var(--muted);font-weight:700}.kname{flex:1;font-size:12px;font-weight:700;cursor:pointer}.kmv{width:46px;text-align:right;font-size:11px;color:var(--accent);font-weight:600}.kpv{width:46px;text-align:right;font-size:11px;color:var(--orange)}.kcomp{width:36px;text-align:right;font-size:9px;font-weight:700;padding:2px 5px;border-radius:10px}.green{color:var(--green);background:rgba(0,200,150,.12);border:1px solid rgba(0,200,150,.3)}.yellow{color:var(--yellow);background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3)}.red{color:var(--red);background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.3)}</style></head><body><header><div class="logo">⚡</div><div><div class="htitle">키워드 분석기</div><div class="hsub">네이버 실시간 API</div></div><div class="live">● LIVE</div></header><main><div class="sbox"><div class="slabel">키워드 입력</div><div class="srow"><input id="kw" placeholder="예) 실손보험비교"/><button class="btn" id="btn" onclick="go()">분석</button></div></div><div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px">🔥 고단가 추천</div><div class="chips" id="chips"></div><div class="loading" id="loading"><div class="spin"></div><div style="font-size:13px;color:var(--muted)">네이버 실시간 조회 중...</div></div><div class="err" id="err"></div><div class="res" id="res"></div></main><script>const CID='4287130',AK='0100000000fb79a613d6dd1481e158bc65a6f9260dea2800684eaa767be69d6d4a41eb40a2',SK='AQAAAADay2tiGGqYMuH98oKMcNB30soJ55wtPiOPdRqLzfxPXQ==';const QK=['실손보험비교','주택담보대출','연금저축펀드','암보험추천','신용대출금리','IRP계좌개설','종합소득세신고','신용카드추천','청약통장활용','실업급여신청','전세자금대출','절세방법직장인'];function nf(n){n=parseInt(n)||0;if(n>=10000)return(Math.round(n/1000)/10)+'만';if(n>=1000)return(Math.round(n/100)/10)+'천';return n.toLocaleString()}function cc(c){return c==='낮음'?'green':c==='높음'?'red':'yellow'}async function hmac(ts,m,p){const msg={ts}.{m}.{p}{encodeURIComponent(t)}&showDetail=1;const r=await fetch(url,{headers:{'X-Timestamp':ts,'X-API-KEY':AK,'X-Customer':CID,'X-Signature':sig}});if(!r.ok)throw new Error('API오류:'+r.status);const d=await r.json();const list=d.keywordList||[];if(!list.length)throw new Error('결과없음');const main=list.find(k=>k.relKeyword===t)||list[0];const mv=parseInt(main.monthlyMobileQcCnt)||0;const pv=parseInt(main.monthlyPcQcCnt)||0;const good=list.filter(k=>k.relKeyword!==t&&(parseInt(k.monthlyMobileQcCnt)||0)>=3000&&k.compIdx==='낮음').sort((a,b)=>(parseInt(b.monthlyMobileQcCnt)||0)-(parseInt(a.monthlyMobileQcCnt)||0)).slice(0,30);const all=list.filter(k=>k.relKeyword!==t&&(parseInt(k.monthlyMobileQcCnt)||0)>=1000).sort((a,b)=>(parseInt(b.monthlyMobileQcCnt)||0)-(parseInt(a.monthlyMobileQcCnt)||0)).slice(0,30);const show=good.length>0?good:all;document.getElementById('res').innerHTML="{t}"{new Date().toLocaleDateString('ko-KR')} 실시간📱 모바일 검색량{nf(mv)}월간 실측💻 PC 검색량{nf(pv)}월간 실측📊 총 검색량{nf(mv+pv)}월간 합계⚡ 경쟁도{main.compIdx||'보통'}네이버 기준🟢 공략 추천 키워드 ({show.length}개) · 탭→분석#키워드모바일PC경쟁{show.map((r,i)=><div class="krow"><div class="knum">${i+1}</div><div class="kname" onclick="go('${r.relKeyword}')">${r.relKeyword}</div><div class="kmv">${nf(parseInt(r.monthlyMobileQcCnt)||0)}</div><div class="kpv">${nf(parseInt(r.monthlyPcQcCnt)||0)}</div><div class="kcomp ${cc(r.compIdx)}">${r.compIdx||'보통'}</div></div>).join('')};document.getElementById('res').style.display='block'}catch(e){document.getElementById('err').style.display='block';document.getElementById('err').textContent='분석실패: '+e.message}finally{document.getElementById('loading').style.display='none';document.getElementById('btn').disabled=false}}document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('chips');QK.forEach(q=>{const d=document.createElement('div');d.className='chip';d.textContent=q;d.onclick=()=>{document.getElementById('kw').value=q;go(q)};c.appendChild(d)});document.getElementById('kw').addEventListener('keydown',e=>{if(e.key==='Enter')go()})});</script></body></html>
