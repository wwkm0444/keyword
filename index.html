<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키워드분석기</title><style>body{background:#060810;color:#f0f6ff;font-family:sans-serif;padding:20px}input{width:100%;padding:12px;background:#111827;border:1px solid #1c2a3a;border-radius:10px;color:#f0f6ff;font-size:16px;margin-bottom:10px}button{width:100%;padding:12px;background:#00d4ff;border:none;border-radius:10px;color:#000;font-size:16px;font-weight:700;cursor:pointer}#result{margin-top:20px}</style></head><body><h2>⚡ 키워드 분석기</h2><input id="kw" placeholder="키워드 입력 예) 실손보험비교"/><button onclick="go()">분석</button><div id="result"></div><script>const CID='4287130',AK='0100000000fb79a613d6dd1481e158bc65a6f9260dea2800684eaa767be69d6d4a41eb40a2',SK='AQAAAADay2tiGGqYMuH98oKMcNB30soJ55wtPiOPdRqLzfxPXQ==';function nf(n){n=parseInt(n)||0;if(n>=10000)return(Math.round(n/1000)/10)+'만';if(n>=1000)return(Math.round(n/100)/10)+'천';return n.toLocaleString()}async function go(){const t=document.getElementById('kw').value.trim();if(!t)return;document.getElementById('result').innerHTML='분석 중...';try{const ts=Date.now();const msg=ts+'.GET./keywordstool';const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(SK),{name:'HMAC',hash:'SHA-256'},false,['sign']);const sig=await crypto.subtle.sign('HMAC',key,enc.encode(msg));const b64=btoa(String.fromCharCode(...new Uint8Array(sig)));const url='https://api.searchad.naver.com/keywordstool?hintKeywords='+encodeURIComponent(t)+'&showDetail=1';const r=await fetch(url,{headers:{'X-Timestamp':ts,'X-API-KEY':AK,'X-Customer':CID,'X-Signature':b64}});const d=await r.json();const list=d.keywordList||[];if(!list.length){document.getElementById('result').innerHTML='결과없음';return}let html='<table style="width:100%;border-collapse:collapse"><tr style="background:#1c2a3a"><th style="padding:8px;text-align:left">키워드</th><th style="padding:8px">모바일</th><th style="padding:8px">PC</th><th style="padding:8px">경쟁</th></tr>';list.filter(k=>(parseInt(k.monthlyMobileQcCnt)||0)>=1000).sort((a,b)=>(parseInt(b.monthlyMobileQcCnt)||0)-(parseInt(a.monthlyMobileQcCnt)||0)).slice(0,30).forEach(k=>{const c=k.compIdx==='낮음'?'#00c896':k.compIdx==='높음'?'#f87171':'#fbbf24';html+={k.relKeyword}{nf(parseInt(k.monthlyMobileQcCnt)||0)}{nf(parseInt(k.monthlyPcQcCnt)||0)}{k.compIdx||'-'}});html+='</table>';document.getElementById('result').innerHTML=html}catch(e){document.getElementById('result').innerHTML='오류: '+e.message}}</script></body></html>
