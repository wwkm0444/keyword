<!DOCTYPE html><html><head><meta charset="UTF-8"><title>키워드분석기</title></head><body style="background:#060810;color:#f0f6ff;font-family:sans-serif;padding:20px"><h2>⚡ 키워드 분석기</h2><input id="kw" placeholder="키워드 입력" style="width:100%;padding:12px;background:#111827;border:1px solid #1c2a3a;border-radius:10px;color:#f0f6ff;font-size:16px;margin-bottom:10px;display:block"><button onclick="go()" style="width:100%;padding:12px;background:#00d4ff;border:none;border-radius:10px;color:#000;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:20px">분석</button><div id="r" style="font-size:14px"></div><script>async function go(){var t=document.getElementById('kw').value.trim();if(!t)return;document.getElementById('r').innerHTML='분석중...';try{var ts=Date.now();var msg=ts+'.GET./keywordstool';var enc=new TextEncoder();var sk='AQAAAADay2tiGGqYMuH98oKMcNB30soJ55wtPiOPdRqLzfxPXQ==';var key=await crypto.subtle.importKey('raw',enc.encode(sk),{name:'HMAC',hash:'SHA-256'},false,['sign']);var sig=await crypto.subtle.sign('HMAC',key,enc.encode(msg));var b64=btoa(String.fromCharCode.apply(null,new Uint8Array(sig)));var res=await fetch('https://api.searchad.naver.com/keywordstool?hintKeywords='+encodeURIComponent(t)+'&showDetail=1',{headers:{'X-Timestamp':String(ts),'X-API-KEY':'0100000000fb79a613d6dd1481e158bc65a6f9260dea2800684eaa767be69d6d4a41eb40a2','X-Customer':'4287130','X-Signature':b64}});var d=await res.json();var list=(d.keywordList||[]).filter(function(k){return(parseInt(k.monthlyMobileQcCnt)||0)>=1000}).sort(function(a,b){return(parseInt(b.monthlyMobileQcCnt)||0)-(parseInt(a.monthlyMobileQcCnt)||0)}).slice(0,30);var h='<table style="width:100%;border-collapse:collapse"><tr style="background:#1c2a3a;font-size:12px"><th style="padding:8px;text-align:left">키워드</th><th style="padding:8px">모바일</th><th style="padding:8px">경쟁</th></tr>';list.forEach(function(k,i){var mv=parseInt(k.monthlyMobileQcCnt)||0;var c=k.compIdx==='낮음'?'#00c896':k.compIdx==='높음'?'#f87171':'#fbbf24';var n=mv>=10000?(Math.round(mv/1000)/10)+'만':mv>=1000?(Math.round(mv/100)/10)+'천':mv;h+='<tr style="border-bottom:1px solid #1c2a3a"><td style="padding:8px;cursor:pointer;color:#00d4ff" onclick="document.getElementById(\'kw\').value=\''+k.relKeyword+'\';go()">'+k.relKeyword+'</td><td style="padding:8px;text-align:center">'+n+'</td><td style="padding:8px;text-align:center;color:'+c+'">'+k.compIdx+'</td></tr>'});document.getElementById('r').innerHTML=h+'</table>'}catch(e){document.getElementById('r').innerHTML='오류:'+e.message}}</script></body></html>
